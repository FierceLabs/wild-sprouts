[build]
  command = "npm run build"
  publish = ".next"

[[headers]]
  for = "/hls/*.m3u8"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/hls/*/*.m3u8"
  [headers.values]
    Content-Type = "application/vnd.apple.mpegurl"

[[headers]]
  for = "/hls/*.ts"
  [headers.values]
    Content-Type = "video/mp2t"

[[headers]]
  for = "/hls/*/*.ts"
  [headers.values]
    Content-Type = "video/mp2t"
